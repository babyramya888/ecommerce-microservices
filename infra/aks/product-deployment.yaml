apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-product-service
  template:
    metadata:
      labels:
        app: quarkus-product-service
    spec:
      containers:
        - name: quarkus-product-service
          image: quarkus-product-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: QUARKUS_MONGODB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: connection-string
            - name: QUARKUS_MONGODB_DATABASE
              value: product_db
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: file:///app/publicKey.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/publicKey.pem
              subPath: publicKey.pem
          imagePullPolicy: Always
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-product-service
spec:
  selector:
    app: quarkus-product-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
