apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dotnet-notification-service
  template:
    metadata:
      labels:
        app: dotnet-notification-service
    spec:
      containers:
        - name: dotnet-notification-service
          image: dotnet-notification-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
          imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-notification-service
spec:
  selector:
    app: dotnet-notification-service
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
