apiVersion: apps/v1
kind: Deployment
metadata:
  name: quarkus-auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quarkus-auth-service
  template:
    metadata:
      labels:
        app: quarkus-auth-service
    spec:
      containers:
        - name: quarkus-auth-service
          image: quarkus-auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: QUARKUS_MONGODB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: connection-string
            - name: QUARKUS_MONGODB_DATABASE
              value: auth_db
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: file:///app/privateKey.pem
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: file:///app/publicKey.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/privateKey.pem
              subPath: privateKey.pem
            - name: jwt-keys
              mountPath: /app/publicKey.pem
              subPath: publicKey.pem
          imagePullPolicy: Always
          volumes:
            - name: jwt-keys
              secret:
                secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: quarkus-auth-service
spec:
  selector:
    app: quarkus-auth-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
